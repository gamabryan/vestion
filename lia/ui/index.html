<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vestion</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/" } }
</script>
</head>
<body class="idle">
  <div class="fallback-core" aria-hidden="true"><div class="ring"></div><div class="ring r2"></div><div class="dot"></div></div>

  <header class="hud">
    <div class="brand">VESTION <span id="state-label">· EM ESPERA</span></div>
    <div class="clock" id="clock"></div>
  </header>

  <aside class="col left">
    <section class="glass" id="panel-agenda">
      <h4>AGENDA · HOJE</h4>
      <div class="rows"><div class="soon">EM BREVE</div></div>
    </section>
    <section class="glass" id="panel-whatsapp">
      <h4>WHATSAPP</h4>
      <div class="rows"><div class="soon">EM BREVE</div></div>
    </section>
  </aside>

  <aside class="col right">
    <section class="glass" id="panel-gmail">
      <h4>GMAIL</h4>
      <div class="rows"><div class="soon">EM BREVE</div></div>
    </section>
    <section class="glass" id="panel-sistema">
      <h4>SISTEMA</h4>
      <div class="rows">
        <div class="metric"><span>CPU</span><b id="cpu">–</b></div><div class="bar"><i id="cpu-bar"></i></div>
        <div class="metric"><span>Memória</span><b id="mem">–</b></div><div class="bar"><i id="mem-bar"></i></div>
        <div class="metric"><span>Plano Claude</span><b id="uso">–</b></div><div class="bar"><i id="uso-bar"></i></div>
        <div class="metric"><span>Pedidos hoje</span><b id="pedidos">0</b></div>
        <div class="limit" id="limite" hidden>LIMITE ATINGIDO</div>
      </div>
    </section>
  </aside>

  <footer class="caption">
    <div class="you" id="you"></div>
    <div class="lia" id="caption">Aperte o atalho e fale comigo.</div>
  </footer>

  <div class="confirm-overlay" id="confirm" hidden>
    <div class="confirm-card glass">
      <div class="confirm-tag">CONFIRMAÇÃO NECESSÁRIA</div>
      <h2 id="confirm-title"></h2>
      <pre id="confirm-detail"></pre>
      <div class="confirm-hint">Clique, aperte Enter / Esc, ou diga “pode”.</div>
      <div class="confirm-buttons">
        <button class="yes" id="btn-yes">PODE</button>
        <button class="no" id="btn-no">CANCELAR</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script type="module" src="face.js"></script>
</body>
</html>
